[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flux-image-local"
version = "0.1.0"
description = "One local FLUX 3 INT8 worker with MCP, HTTP and CLI access"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "starlette==0.46.2", "uvicorn==0.34.3", "mcp==1.30.0",
  "httpx>=0.28,<1", "pillow>=11,<14", "filelock>=3,<5",
  "huggingface-hub>=1,<2", "tomlkit>=0.13,<1", "truststore>=0.10,<1",
]

[project.optional-dependencies]
inference = [
  "torch==2.14.1", "torchvision==0.29.1", "accelerate==1.15.0", "bitsandbytes==0.50.2",
  "comfy-kitchen==0.2.37", "safetensors>=0.5,<1", "sentencepiece>=0.2,<1",
  "diffusers @ https://github.com/huggingface/diffusers/archive/d42ebf9c6e0b46103b74283f5324357a67acaa04.tar.gz",
  "transformers @ https://github.com/huggingface/transformers/archive/966f59c897c15db8a5e14882d086beba8d6d0b9f.tar.gz",
]
test = ["pytest>=8", "pytest-asyncio>=0.25"]

[project.scripts]
flux-image = "flux_image.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_image"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
